# Sitio estático: no requiere build. Netlify publica la carpeta tal cual.
# Usar un sitio de Netlify distinto al de la landing del almacén.
[build]
  publish = "."
  command = ""

# Encabezados de seguridad para todo el sitio.
# El formulario de contacto usa Netlify Forms y se envía al mismo dominio,
# por eso alcanza con form-action 'self'.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Cache largo para recursos estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
